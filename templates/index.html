<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume Parser</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-900">

<div class="min-h-screen flex justify-center items-center">

<div class="bg-slate-800 w-full max-w-lg rounded-xl shadow-xl p-8">

<h1 class="text-4xl font-bold text-center text-blue-400">

AI Resume Parser

</h1>

<p class="text-center text-gray-300 mt-2">

Upload your resume (PDF or DOCX)

</p>

<form
action="/upload"
method="POST"
enctype="multipart/form-data"
class="mt-8">

<input
type="file"
name="resume"
accept=".pdf,.doc,.docx"
class="w-full p-3 rounded-lg bg-slate-700 text-white">

<button
class="w-full mt-6 bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-semibold">

Upload Resume

</button>

</form>

</div>

</div>

</body>

</html>
